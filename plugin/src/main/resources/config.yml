# ImageCover 配置
#
# 单张图片指令（/icv play、/icv wgplay）的淡入淡出开关。
# setplay / setwgplay 不受这里影响，它们在 set.yml 中按每个 set 单独设置
# （未写的 set 沿用这里的默认值）。
fade: true

# 淡入 / 淡出各自的时长（秒），可精确到 0.1
fade-duration: 0.3

# 背景遮罩：在图片下方铺一层全屏纯色（黑色）遮罩。
#
# 默认关闭（false），推荐保持关闭：
#   - 图片直接覆盖在游戏画面上，透明背景的 PNG 可以实现
#     "提示文本 / UI 覆盖在游戏上"的效果；
#   - 淡入淡出作用在游戏画面上，清晰可见。
#
# 若开启（true），不透明图片淡出时透出的是"同样在淡出的黑底"，
# 视觉上淡出会显得不明显——这是渲染原理决定的，不是 bug。
#
# 可用指令临时全局开关：/icv bg on   /icv bg off
background:
  enabled: false
  # 遮罩不透明度（0~100）。0=完全透明（等同关闭），100=纯黑。
  # 设为 30~60 可得到"电影感压暗"的效果：图片清楚，游戏画面隐约可见。
  alpha: 100

# 通信协议版本（一般不要改）。
#   2 = 新协议，带背景参数（需要客户端 Mod v1.0.4+）
#   1 = 旧协议，不带背景参数（兼容 v1.0.3 及更早的客户端）
# 如果你的玩家还没全部更新客户端，可临时改成 1；此时背景遮罩不可用。
protocol: 2
